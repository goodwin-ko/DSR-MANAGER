name: Hourly Internal Rank Top 50 Collector

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-top50:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect TOP 50 rankings and hourly snapshot
        run: python scripts/collect_internal_top50.py

      - name: Commit and push updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_internal_100.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: hourly internal top50 ranking snapshot ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST'))"
            git push
          fi
